<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%23c2410c'/%3E%3Cpath d='M8 22c3-.4 5-2.6 6.4-6.2C15.8 12 17.6 9.6 24 9.4' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='9.4' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f6f4ef;
  --surface: #ffffff;
  --surface-2: #f0ede6;
  --ink: #1d1f24;
  --ink-2: #4a4f59;
  --ink-3: #7b808b;
  --line: #e2ded4;
  --line-2: #cfc9bc;
  --brand: #c2410c;
  --brand-ink: #ffffff;
  --brand-soft: #fde9dc;
  --accent: #0f5c63;
  --accent-soft: #dcefee;
  --good: #1f7a45;
  --good-soft: #def3e5;
  --warn: #a15c00;
  --warn-soft: #fbeccd;
  --bad: #b42335;
  --bad-soft: #f9dde1;
  --st0: #b9b5ab;
  --st1: #8fb4c9;
  --st2: #4f8fb3;
  --st3: #d9822b;
  --st4: #1f7a45;
  --lv-staff: #7a5cc2;
  --lv-exec: #0f5c63;
  --lv-mid: #9a4a8a;
  --lv-front: #c2410c;
  --shadow: 0 1px 2px rgba(30, 25, 15, .06), 0 4px 14px rgba(30, 25, 15, .06);
  --shadow-lg: 0 12px 40px rgba(20, 15, 5, .18);
  --radius: 12px;
  --radius-sm: 8px;
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-display: 'Fraunces', Georgia, 'Times New Roman', serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171b; --surface: #1d2026; --surface-2: #252931; --ink: #eceae4; --ink-2: #b9bcc4; --ink-3: #8a8f99;
    --line: #2f343d; --line-2: #3d434d; --brand: #f07a3c; --brand-ink: #1a0d05; --brand-soft: #3a2316;
    --accent: #5cc3c9; --accent-soft: #173638; --good: #4cc27c; --good-soft: #173826; --warn: #e5a640; --warn-soft: #3a2d14;
    --bad: #f0697b; --bad-soft: #3d1a20; --st0: #5d616a; --st1: #5f8aa3; --st2: #4d9acb; --st3: #e8994a; --st4: #4cc27c;
    --lv-staff: #a68ae6; --lv-exec: #5cc3c9; --lv-mid: #d585c4; --lv-front: #f07a3c;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171b; --surface: #1d2026; --surface-2: #252931; --ink: #eceae4; --ink-2: #b9bcc4; --ink-3: #8a8f99;
  --line: #2f343d; --line-2: #3d434d; --brand: #f07a3c; --brand-ink: #1a0d05; --brand-soft: #3a2316;
  --accent: #5cc3c9; --accent-soft: #173638; --good: #4cc27c; --good-soft: #173826; --warn: #e5a640; --warn-soft: #3a2d14;
  --bad: #f0697b; --bad-soft: #3d1a20; --st0: #5d616a; --st1: #5f8aa3; --st2: #4d9acb; --st3: #e8994a; --st4: #4cc27c;
  --lv-staff: #a68ae6; --lv-exec: #5cc3c9; --lv-mid: #d585c4; --lv-front: #f07a3c;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 14px rgba(0, 0, 0, .25); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0 0 .4em; line-height: 1.2; }
h1, h2 { font-family: var(--font-display); font-weight: 600; letter-spacing: -.01em; }
h1 { font-size: clamp(28px, 4vw, 44px); }
h2 { font-size: clamp(22px, 2.6vw, 28px); }
h3 { font-size: 17px; font-weight: 650; }
h4 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 650; }
p { margin: 0 0 .8em; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
.muted { color: var(--ink-3); }
.small { font-size: 13px; }
.tiny { font-size: 12px; }
.hidden { display: none !important; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
  padding: 9px 16px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: 14px; transition: background .15s, border-color .15s, transform .05s; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.btn-primary:hover { background: var(--brand); filter: brightness(1.06); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-lg { padding: 13px 24px; font-size: 15px; }
.btn-sm { padding: 6px 12px; font-size: 13px; }
.icon { width: 18px; height: 18px; flex: none; }

/* ---------- layout ---------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 10px 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; cursor: pointer; background: none; border: 0; padding: 0; }
.brand-mark { width: 30px; height: 30px; }
.brand small { display: block; font-weight: 500; color: var(--ink-3); font-size: 12px; }
.nav { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav button { background: none; border: 0; padding: 8px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; color: var(--ink-2); white-space: nowrap; font-size: 14px; }
.nav button:hover { background: var(--surface-2); color: var(--ink); }
.nav button.active { background: var(--brand-soft); color: var(--brand); }
.nav .badge-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--brand); margin-left: 5px; vertical-align: middle; }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: 42px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg); min-width: 220px; padding: 6px; z-index: 30; }
.menu button { display: flex; width: 100%; text-align: left; background: none; border: 0; padding: 9px 12px; border-radius: 8px; cursor: pointer; gap: 10px; align-items: center; }
.menu button:hover { background: var(--surface-2); }
.main { flex: 1; width: 100%; max-width: 1280px; margin: 0 auto; padding: 24px 20px 150px; }
.main.full { max-width: none; padding: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 20px; }
.card + .card { margin-top: 16px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.section-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.section-head p { margin: 0; color: var(--ink-2); }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.brand { background: var(--brand-soft); color: var(--brand); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }

/* ---------- status bar ---------- */
.statusbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); box-shadow: 0 -4px 18px rgba(0, 0, 0, .05);
  display: grid; grid-template-columns: 1.1fr 1.6fr 1fr 1.1fr; }
.stat { padding: 12px 20px 14px; border-right: 1px solid var(--line); min-width: 0; }
.stat:last-child { border-right: 0; }
.stat-label { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; font-weight: 650; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 8px; gap: 8px; }
.stat-label b { font-size: 15px; color: var(--ink); text-transform: none; letter-spacing: 0; font-variant-numeric: tabular-nums; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.bar > span { display: block; height: 100%; border-radius: 999px; background: var(--ink-2); transition: width .6s cubic-bezier(.2, .8, .2, 1); }
.bar.cred > span { background: var(--accent); }
.bar.cred.low > span { background: var(--bad); }
.dots { display: flex; gap: 3px; align-items: center; position: relative; padding-bottom: 14px; }
.dots i { flex: 1; height: 10px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); transition: background .4s; }
.dots i.on { background: var(--st4); border-color: var(--st4); }
.dots i.trial { background: color-mix(in srgb, var(--st3) 35%, var(--surface-2)); }
.dots .cm-mark { position: absolute; bottom: 0; font-size: 10px; font-weight: 700; color: var(--brand); transform: translateX(-50%); white-space: nowrap; letter-spacing: .04em; }
.dots .cm-mark::before { content: ''; position: absolute; left: 50%; bottom: 13px; width: 2px; height: 16px; background: var(--brand); transform: translateX(-50%); }
.phases { display: flex; align-items: center; }
.phases .ph { display: flex; flex-direction: column; align-items: center; flex: none; gap: 4px; font-size: 11px; font-weight: 650; color: var(--ink-3); text-transform: uppercase; letter-spacing: .04em; }
.phases .ph i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-2); background: var(--surface); }
.phases .ph.done i { background: var(--accent); border-color: var(--accent); }
.phases .ph.now i { background: var(--brand); border-color: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
.phases .ph.now { color: var(--brand); }
.phases .ln { flex: 1; height: 2px; background: var(--line-2); margin: 0 6px 18px; }
.phases .ln.done { background: var(--accent); }

/* ---------- home ---------- */
.hero { padding: 56px 20px 32px; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 1.15fr .85fr; gap: 40px; align-items: center; }
.hero p.lead { font-size: 18px; color: var(--ink-2); max-width: 560px; }
.hero-art { aspect-ratio: 1 / .82; }
.kicker { font-size: 13px; font-weight: 700; color: var(--brand); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 12px; }
.home-body { max-width: 1100px; margin: 0 auto; padding: 0 20px 80px; }
.mode-tabs { display: inline-flex; background: var(--surface-2); border-radius: 999px; padding: 4px; gap: 4px; margin-bottom: 18px; }
.mode-tabs button { border: 0; background: none; padding: 8px 18px; border-radius: 999px; font-weight: 650; cursor: pointer; color: var(--ink-2); }
.mode-tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
.field input, .field textarea, .field select { font: inherit; padding: 10px 12px; border-radius: var(--radius-sm); border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }

.matrix { display: grid; grid-template-columns: 34px 1fr 1fr; grid-template-rows: auto 1fr 1fr; gap: 12px; }
.matrix .axis-x { grid-column: 2 / 4; display: grid; grid-template-columns: 1fr 1fr; text-align: center; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.matrix .axis-y { grid-row: 2 / 4; writing-mode: vertical-rl; transform: rotate(180deg); display: flex; justify-content: space-around; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.scn { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 18px; cursor: pointer; box-shadow: var(--shadow); transition: border-color .15s, transform .15s, box-shadow .15s; display: flex; flex-direction: column; gap: 6px; min-height: 170px; }
.scn:hover { border-color: var(--brand); transform: translateY(-2px); box-shadow: var(--shadow-lg); }
.scn.selected { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.scn .num { font-size: 12px; font-weight: 700; color: var(--brand); letter-spacing: .08em; text-transform: uppercase; }
.scn h3 { font-family: var(--font-display); font-size: 21px; font-weight: 600; margin: 0; }
.scn p { margin: 0; color: var(--ink-2); font-size: 14px; }
.scn .meta { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; padding-top: 8px; }
.resume { display: flex; align-items: center; gap: 16px; justify-content: space-between; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent); }

.roles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.auth { display: inline-flex; gap: 2px; align-items: flex-end; }
.auth i { width: 5px; border-radius: 1px; background: var(--line-2); display: inline-block; }
.auth i:nth-child(1) { height: 6px; } .auth i:nth-child(2) { height: 9px; } .auth i:nth-child(3) { height: 12px; } .auth i:nth-child(4) { height: 15px; }
.auth i.on { background: var(--brand); }
.dl-options { display: grid; gap: 10px; }
.dl-opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; transition: border-color .15s, background .15s, transform .1s; }
.dl-opt:hover { border-color: var(--brand); background: var(--brand-soft); }
.dl-opt:active { transform: translateY(1px); }
.dl-opt b { font-size: 15px; }
.dl-opt span { font-size: 14px; color: var(--ink-2); }

/* ---------- brief ---------- */
.brief { display: grid; grid-template-columns: 1.3fr .7fr; gap: 20px; align-items: start; }
.brief .prose p { font-size: 16px; color: var(--ink-2); }
.brief .prose p:first-of-type::first-letter { font-family: var(--font-display); font-size: 3em; float: left; line-height: .9; padding: 4px 8px 0 0; color: var(--brand); }
.quote { border-left: 3px solid var(--brand); padding: 4px 0 4px 14px; margin: 0 0 14px; }
.quote b { display: block; font-size: 13px; }
.quote span { color: var(--ink-2); font-style: italic; }
ul.clean { margin: 0; padding-left: 18px; }
ul.clean li { margin-bottom: 6px; }

/* ---------- org chart ---------- */
.org { overflow-x: auto; padding-bottom: 8px; }
.org-inner { min-width: 1120px; }
.org-col { min-width: 0; }
.org-children .org-children { margin-left: 10px; padding-left: 8px; }
.org-top { display: flex; flex-direction: column; align-items: center; position: relative; }
.org-row { display: flex; justify-content: center; gap: 80px; position: relative; margin-top: 22px; }
.org-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr) minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1.15fr); gap: 14px; margin-top: 26px; position: relative; padding-top: 22px; border-top: 2px solid var(--line-2); }
.org-col { display: flex; flex-direction: column; gap: 10px; position: relative; }
.org-col::before { content: ''; position: absolute; top: -24px; left: 50%; width: 2px; height: 22px; background: var(--line-2); }
.org-children { margin-left: 16px; padding-left: 12px; border-left: 2px solid var(--line-2); display: flex; flex-direction: column; gap: 10px; }
.org-dept { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: .07em; text-align: center; margin-bottom: -4px; }

.pc { position: relative; display: flex; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px 9px 9px; box-shadow: var(--shadow);
  cursor: pointer; text-align: left; width: 100%; transition: border-color .15s, box-shadow .15s, transform .1s; border-top: 3px solid var(--lvc, var(--line-2)); }
.pc:hover { border-color: var(--ink-3); border-top-color: var(--lvc); }
.pc.sel { box-shadow: 0 0 0 3px var(--brand); border-color: var(--brand); }
.pc.dim { opacity: .45; }
.pc.flash { animation: flash 1.4s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 0 var(--good); } 30% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--good) 40%, transparent); } 100% { box-shadow: var(--shadow); } }
.pc.you { width: 230px; border-top-color: var(--brand); }
.pc.wide { width: 250px; }
.av { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; font-size: 13px; color: #fff; background: var(--lvc, var(--ink-3)); letter-spacing: .02em; }
.pc-body { min-width: 0; flex: 1; }
.pc-name { font-weight: 650; font-size: 13.5px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pc-title { font-size: 11.5px; color: var(--ink-3); line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.meter { display: flex; gap: 3px; margin-top: 6px; }
.meter i { flex: 1; height: 5px; border-radius: 2px; background: var(--surface-2); border: 1px solid var(--line); }
.meter i.on { border: 0; }
.pc-stage { font-size: 11px; font-weight: 650; margin-top: 3px; }
.pc-flags { position: absolute; top: -9px; right: 6px; display: flex; gap: 4px; }
.flag { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line-2); box-shadow: var(--shadow); }
.flag svg { width: 12px; height: 12px; }
.flag.res { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.flag.fear { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.flag.int { color: var(--accent); }
.pc .check { position: absolute; top: 8px; left: -8px; width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--line-2); background: var(--surface); display: grid; place-items: center; }
.pc.sel .check { background: var(--brand); border-color: var(--brand); color: #fff; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- stage summary ---------- */
.stage-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
.stage-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; border-left: 4px solid var(--c); }
.stage-box b { font-size: 26px; font-family: var(--font-display); display: block; line-height: 1.1; }
.stage-box span { font-size: 12px; color: var(--ink-3); font-weight: 650; text-transform: uppercase; letter-spacing: .05em; }

/* ---------- decide ---------- */
.decide { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 20px; align-items: start; }
.lever-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.lever-table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; padding: 8px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.lever-table td { padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.lever-table tr { cursor: pointer; }
.lever-table tbody tr:hover td { background: var(--surface-2); }
.lever-table tr.active td { background: var(--brand-soft); }
.lever-table tr.locked td { color: var(--ink-3); }
.lever-table .lname { font-weight: 600; }
.lever-table .num { text-align: center; font-variant-numeric: tabular-nums; }
.kind { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 8px; vertical-align: middle; }
.kind.enabling { background: var(--accent); }
.kind.substantive { background: var(--brand); }
.lever-panel { position: sticky; top: 76px; }
.lever-panel .desc { color: var(--ink-2); }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
.fact { background: var(--surface-2); border-radius: var(--radius-sm); padding: 8px 10px; }
.fact span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); font-weight: 700; }
.fact b { font-size: 15px; }
.stage-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.stage-chip { font-size: 12px; font-weight: 650; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-3); }
.stage-chip.on { color: #fff; border-color: transparent; }
.notice { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 13.5px; margin: 10px 0; }
.notice.warn { background: var(--warn-soft); color: var(--warn); }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--accent-soft); color: var(--accent); }
.notice .icon { margin-top: 1px; }
.picker { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 470px; overflow-y: auto; padding: 10px 10px 4px 12px; margin: 0 -6px; }
.picker .pc { padding: 7px 8px 7px 10px; }
.picker .av { width: 30px; height: 30px; font-size: 11px; }
.picker .pc-name { font-size: 13px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; gap: 10px; flex-wrap: wrap; }
.picker-tools { display: flex; gap: 6px; }
.submit-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.empty { text-align: center; padding: 40px 20px; color: var(--ink-3); }

/* ---------- network ---------- */
.net-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
.net svg { width: 100%; height: auto; display: block; }
.net .node { cursor: pointer; }
.net .node text { font-size: 12px; fill: var(--ink-2); font-family: var(--font); font-weight: 600; }
.net .edge { fill: none; stroke-width: 1.4; opacity: .5; transition: opacity .2s, stroke-width .2s; }
.net .edge.formal { stroke: var(--good); }
.net .edge.friend { stroke: var(--warn); }
.net .edge.both { stroke: var(--accent); }
.net.focus .edge { opacity: .07; }
.net.focus .edge.hl { opacity: 1; stroke-width: 2.6; }
.net.focus .node.fade { opacity: .3; }

/* ---------- modal ---------- */
.overlay { position: fixed; inset: 0; background: rgba(15, 12, 8, .55); backdrop-filter: blur(3px); z-index: 50; display: grid; place-items: center; padding: 20px; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: min(720px, 100%); max-height: calc(100vh - 40px); overflow-y: auto; animation: rise .25s cubic-bezier(.2, .8, .2, 1); }
@keyframes rise { from { transform: translateY(16px); opacity: 0; } }
.modal-head { padding: 22px 26px 0; display: flex; justify-content: space-between; gap: 20px; align-items: flex-start; }
.modal-body { padding: 18px 26px 6px; }
.modal-foot { padding: 14px 26px 22px; display: flex; justify-content: flex-end; gap: 10px; }
.news-kicker { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.cred-box { text-align: center; flex: none; }
.cred-box .n { width: 74px; height: 74px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-size: 36px; font-weight: 600; background: var(--surface-2); }
.cred-box.up .n { background: var(--good-soft); color: var(--good); }
.cred-box.down .n { background: var(--bad-soft); color: var(--bad); }
.cred-box small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; margin-top: 6px; color: var(--ink-3); }
.outcome { font-size: 19px; font-family: var(--font-display); margin: 6px 0 0; }
.moved { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 10px; }
.moved-col h4 { display: flex; align-items: center; gap: 6px; }
.moved-col h4 i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.moved-col div { font-weight: 600; font-size: 14px; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }

/* ---------- person drawer ---------- */
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(400px, 100%); background: var(--surface); z-index: 55; box-shadow: var(--shadow-lg); padding: 24px; overflow-y: auto; animation: slide .25s cubic-bezier(.2, .8, .2, 1); border-left: 1px solid var(--line); }
@keyframes slide { from { transform: translateX(30px); opacity: 0; } }
.drawer .av { width: 56px; height: 56px; font-size: 18px; }
.drawer-head { display: flex; gap: 14px; align-items: center; margin-bottom: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.locked-box { border: 1.5px dashed var(--line-2); border-radius: var(--radius-sm); padding: 14px; color: var(--ink-3); font-size: 14px; }

/* ---------- history / charts ---------- */
.hist-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.hist-table th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding: 8px; border-bottom: 1px solid var(--line); }
.hist-table td { padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--ink-3); font-size: 11px; }
.chart .grid { stroke: var(--line); }

/* ---------- debrief ---------- */
.debrief-hero { display: grid; grid-template-columns: auto 1fr; gap: 28px; align-items: center; }
.ring { width: 150px; height: 150px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring .val b { font-family: var(--font-display); font-size: 42px; line-height: 1; display: block; }
.ring .val span { font-size: 12px; color: var(--ink-3); font-weight: 650; }
.breakdown { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
.insight { display: flex; gap: 12px; padding: 14px; border-radius: var(--radius-sm); background: var(--surface-2); }
.insight .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.insight.good .ic { background: var(--good-soft); color: var(--good); }
.insight.warn .ic { background: var(--warn-soft); color: var(--warn); }
.insight b { display: block; margin-bottom: 2px; }
.insight p { margin: 0; font-size: 14px; color: var(--ink-2); }
.insights { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.timeline { display: flex; flex-wrap: wrap; gap: 6px; }
.tl { font-size: 12px; padding: 4px 9px; border-radius: 6px; background: var(--surface-2); border-left: 3px solid var(--c, var(--line-2)); }
.code-box { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; word-break: break-all; max-height: 120px; overflow-y: auto; }
.reflect li { margin-bottom: 10px; }

/* ---------- facilitator ---------- */
.lb { width: 100%; border-collapse: collapse; font-size: 14px; }
.lb th { text-align: left; font-size: 11.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); padding: 8px; border-bottom: 1px solid var(--line); cursor: pointer; white-space: nowrap; }
.lb td { padding: 10px 8px; border-bottom: 1px solid var(--line); }
.lb .rank { font-family: var(--font-display); font-size: 18px; font-weight: 600; width: 36px; }
.bars .row { display: grid; grid-template-columns: 200px 1fr 40px; gap: 10px; align-items: center; margin-bottom: 6px; font-size: 13px; }
.bars .track { height: 12px; background: var(--surface-2); border-radius: 4px; overflow: hidden; }
.bars .track span { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
.drop { border: 2px dashed var(--line-2); border-radius: var(--radius); padding: 20px; text-align: center; color: var(--ink-3); transition: border-color .15s, background .15s; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }

/* ---------- playbook ---------- */
.concept-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.concept-matrix .cell { border-radius: var(--radius-sm); padding: 14px; background: var(--surface-2); }
.concept-matrix .cell.me { background: var(--brand-soft); outline: 2px solid var(--brand); }
.ladder { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.ladder div { border-radius: var(--radius-sm); padding: 12px; color: #fff; }
.ladder div b { display: block; }
.ladder div span { font-size: 13px; opacity: .92; }

.toast { position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 60; box-shadow: var(--shadow-lg); animation: rise .2s; }

/* ---------- responsive ---------- */
@media (max-width: 1000px) {
  .roles { grid-template-columns: 1fr 1fr; }
  .decide, .brief, .net-wrap, .hero { grid-template-columns: 1fr; }
  .lever-panel { position: static; }
  .hero-art { display: none; }
  .insights { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .topbar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
  .nav { order: 3; width: 100%; margin-left: 0; }
  .brand small { display: none; }
  .menu-wrap { margin-left: auto !important; }
  .main { padding: 16px 16px 190px; }
  .statusbar { grid-template-columns: 1fr 1fr; }
  .stat { padding: 8px 12px 10px; }
  .stat:nth-child(2) { border-right: 0; }
  .stat:nth-child(1), .stat:nth-child(2) { border-bottom: 1px solid var(--line); }
  .grid-2, .grid-3, .form-row, .concept-matrix, .ladder, .roles { grid-template-columns: 1fr; }
  .matrix { grid-template-columns: 1fr; grid-template-rows: none; }
  .matrix .axis-x, .matrix .axis-y { display: none; }
  .stage-strip { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
  .stage-box { padding: 8px; }
  .stage-box b { font-size: 20px; }
  .stage-box span { font-size: 9.5px; }
  .picker { grid-template-columns: 1fr; }
  .facts { grid-template-columns: 1fr 1fr; }
  .debrief-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .breakdown { grid-template-columns: 1fr 1fr; }
  .bars .row { grid-template-columns: 120px 1fr 32px; }
  .lever-table .hide-sm { display: none; }
  .modal-head, .modal-body, .modal-foot { padding-left: 18px; padding-right: 18px; }
}

@media print {
  .topbar, .statusbar, .no-print { display: none !important; }
  .main { padding: 0; max-width: none; }
  body { background: #fff; }
  .card { box-shadow: none; break-inside: avoid; }
}

<div id="app"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Tipping Point needs JavaScript to run.</p></noscript>
<script>
/* Tipping Point — scenario, people and lever data. Pure data, no DOM. */
(function (root) {
  'use strict';

  const STAGES = ['Unaware', 'Aware', 'Interest', 'Trial', 'Adoption'];

  const COMPANY = {
    name: 'Saffron Route Logistics',
    short: 'Saffron Route',
    blurb:
      'Saffron Route Logistics Pvt. Ltd. is a 28-year-old, family-promoted freight and last-mile company with about 1,400 employees and 22 hubs across India. Two years of fuel-price shocks squeezed margins hard; the company has only just returned to steady profit and its lenders are watching the debt covenants closely.',
    program: [
      'AI route and load optimisation across all 22 hubs',
      'An AI dispatch copilot for planners and dispatchers',
      'An AI customer-support agent for shipment queries',
      'Predictive maintenance for the 900-truck fleet'
    ]
  };

  /*
   * Four role-based scenarios. authority: 1 Manager · 2 Director · 3 VP · 4 C-suite.
   * reportsTo: the person (one of the 20) whose backing matters most to you, or null.
   * dilemmas: [dilemmaId, week it surfaces].
   */
  const LEVELS = ['', 'Corporate Manager', 'Director', 'Vice President', 'C-suite'];
  const SCENARIOS = [
    {
      id: 's1', number: 1, level: 'Corporate Manager', authority: 1, power: 'low', urgency: 'high',
      title: 'The Frontline Fixer',
      quadrant: 'Manager · Low power · High urgency',
      strategy: 'Tactical opportunism: use the burning platform to prove value fast, win senior sponsors early, then let them scale it.',
      role: 'Customer Experience Manager', reportsTo: 'kofi',
      weeks: 80, startCred: 7,
      intro: [
        'You are a Customer Experience Manager in the Sales & Customer function, reporting to Kofi Mensah. You own the support playbook and the customer-satisfaction numbers, but not the support team. That belongs to your peer, Ananya Ghosh.',
        'Since Nimbus Retail doubled its volumes, the support backlog has tripled: 9,000 open tickets, four-day response times, and Nimbus has started copying the CEO on complaints. You have seen what an AI support agent and a dispatch copilot could do. You have no budget and no mandate. You do have a burning platform, and a boss who will back you if you bring proof.',
        'Your task: move a critical mass of the 20 key people below to genuine adoption within 80 weeks. Anything company-wide will need senior sponsors, and the critical calls along the way are yours to make.'
      ],
      voices: [
        ['kofi', 'Bring me something that works on real tickets and I will put it in front of the leadership team.'],
        ['ananya', 'My team is drowning. I want help, not another project that lands on us.'],
        ['joanna', 'If a bot answers the calls, what happens to my twelve agents?'],
        ['imran', 'There is no budget line for this. Show me the payback first.']
      ],
      dilemmas: [['budget', 8], ['boss', 20], ['incident', 34], ['union', 52]],
      start: { ananya: 2, daniel: 3, joanna: 1 },
      startNote: 'The backlog crisis has everyone in Sales & Customer talking. Ananya wants help, Daniel already drafts client replies with an AI assistant, and Joanna has heard rumours of a support bot.'
    },
    {
      id: 's2', number: 2, level: 'Director', authority: 2, power: 'low', urgency: 'low',
      title: 'The Builder',
      quadrant: 'Director · Moderate power · Low urgency',
      strategy: 'Cultural advocacy plus local alignment: build capability and proof inside your remit, then enlist VPs to take it company-wide.',
      role: 'Director, Network Planning', reportsTo: 'devika',
      weeks: 104, startCred: 7,
      intro: [
        'You are Director of Network Planning, reporting to Devika Rao, VP Operations. Your 40 planners design the routes and hub loads for all 22 hubs. You can reshape how your own area works, but anything that touches the hubs, the fleet or the budget needs a VP to sign up.',
        'Nothing is broken. Volumes are steady and margins are recovering. But you can see that rivals adopting AI route optimisation will run 8–12% cheaper within three years. Devika is exhausted after the ERP rollout and is lukewarm at best. Push too hard and it looks like empire-building. Wait, and Saffron Route will be late.',
        'Your task: move a critical mass of the 20 key people below to genuine adoption within 104 weeks, building from your own remit outwards.'
      ],
      voices: [
        ['devika', 'After the ERP rollout, my team has no appetite for another system. Convince me it is worth it.'],
        ['arjun', 'If we start now, we can do this properly instead of in a panic later.'],
        ['rajesh', 'If the system plans the routes, what exactly is my job?'],
        ['manpreet', 'AI does not know that the Bhiwandi gate shuts early on Fridays.']
      ],
      dilemmas: [['vendor', 12], ['boss', 30], ['star', 50], ['privacy', 72]],
      start: { kofi: 1, sunita: 1, daniel: 1 },
      startNote: 'With no crisis, AI is a side conversation. The tech team is experimenting, but most leaders have only heard about it in passing.'
    },
    {
      id: 's3', number: 3, level: 'Vice President', authority: 3, power: 'high', urgency: 'high',
      title: 'The Turnaround',
      quadrant: 'VP · High power · High urgency',
      strategy: 'Decisive command within your mandate: use substantive levers early, in parallel with enabling ones, while winning over peers you do not control.',
      role: 'VP, Digital Operations', reportsTo: null,
      weeks: 80, startCred: 7,
      intro: [
        'The CEO hired you three months ago as VP Digital Operations, with a clear brief: "make Saffron Route digital." Two weeks ago Nimbus Retail, 35% of revenue, told the CEO that rival Velocity Freight now offers AI-driven 15-minute delivery windows and automatic re-routing. Nimbus wants live ETA accuracy above 95% within 18 months and a credible plan within 90 days.',
        'You have a formal mandate and a budget for the AI programme. But the VPs of Finance, Operations and People are your peers, not your reports, and at least one of them wanted your job. Your authority is real, but it is borrowed from the CEO, and every time you use it you spend some of the CEO\'s credibility as well as your own.',
        'Your task: move a critical mass of the 20 key people below to genuine adoption within 80 weeks.'
      ],
      voices: [
        ['imran', 'We are highly leveraged. Spending on AI now could put our covenants at risk.'],
        ['devika', 'My hubs just finished an 18-month ERP rollout. My managers will refuse another big change.'],
        ['kofi', 'Nimbus is already comparing us to Velocity. Without a credible answer we lose them.'],
        ['sunita', 'People will hear "AI" and think "layoffs". We need to get ahead of that.']
      ],
      dilemmas: [['incident', 10], ['budget', 22], ['union', 38], ['privacy', 56]],
      start: { gopal: 1, ravi: 1 },
      startNote: 'The Nimbus threat is common knowledge. Rumours about AI and job cuts have already reached the night shift and the drivers.'
    },
    {
      id: 's4', number: 4, level: 'C-suite', authority: 4, power: 'high', urgency: 'low',
      title: 'The Transformer',
      quadrant: 'C-suite · Full power · Low urgency',
      strategy: 'Systemic alignment: rewire goals, skills, incentives and structure so the new way becomes the easy way, without a crisis to rally around.',
      role: 'Chief Executive Officer', reportsTo: null,
      weeks: 104, startCred: 8,
      intro: [
        'You are the CEO, three years into the role after the founder stepped back. The board is supportive and the business is stable for the first time in years.',
        'At the annual strategy retreat you set out a five-year view: AI will separate the winners in logistics from everyone else. There is no crisis forcing your hand, which also means there is no crisis to rally people around. You hold every lever in the company, and every lever you pull sends a signal to 1,400 people.',
        'Your task: move a critical mass of the 20 key people below to genuine adoption within 104 weeks. Your decisions on the critical calls will shape the culture long after the programme ends.'
      ],
      voices: [
        ['imran', 'We have finally stabilised. Why gamble the recovery on something unproven?'],
        ['devika', 'After the ERP rollout, my team has no appetite for another system.'],
        ['arjun', 'If we start now, we can do this properly instead of in a panic later.'],
        ['sunita', 'If we do this, we have to be honest with people about what it means for jobs.']
      ],
      dilemmas: [['board', 14], ['union', 32], ['incident', 52], ['star', 74]],
      start: { kofi: 1, sameer: 1, daniel: 1 },
      startNote: 'Your strategy-retreat speech reached the top team. Below them, AI is mostly something people read about in the news.'
    }
  ];

  /*
   * Critical decisions. Effects:
   *  cred, weeks, gain: [[who, amount]] (who = id | 'boss' | 'all' | 'dept:X' | 'level:X'),
   *  resist / unresist / fear / unfear: [ids], setback: [ids], lock: [[leverId, weeks]],
   *  later: { after, cred, gain, note }  — a delayed consequence.
   *  lowAuthority: { below, ...effects, note } — extra effects if your authority is below `below`.
   */
  const DILEMMAS = {
    budget: {
      title: 'The budget freeze', who: 'imran',
      text: 'Imran Qureshi announces a freeze on all discretionary spending for two quarters to protect the debt covenants. The AI programme\'s training and vendor budget is on the list. You have 48 hours to respond.',
      options: [
        { label: 'Escalate and fight for the budget', detail: 'Take it over Imran\'s head and argue the programme is strategic.', tone: 'mixed',
          effects: { cred: 0, resist: ['imran'], gain: [['kofi', 30]], lowAuthority: { below: 3, cred: -2, note: 'Escalating above your level made you look like you were going around the CFO.' } },
          result: 'You keep the budget, but Imran now sees the programme as a threat to his credibility.', lesson: 'Winning a fight with a powerful resister can cost you a potential ally.' },
        { label: 'Build the ROI case with Finance', detail: 'Accept a smaller budget and co-build a payback model with Neha Bansal.', tone: 'good',
          effects: { weeks: 2, gain: [['imran', 70], ['neha', 80]], lock: [['academy', 12]] },
          result: 'Speaking Finance\'s language took two weeks, but Imran is now curious rather than hostile. External training is on hold for 12 weeks.', lesson: 'Translate the change into the resister\'s own terms.' },
        { label: 'Quietly move money from other projects', detail: 'Keep going by shifting spend from budgets you can influence.', tone: 'poor',
          effects: { cred: -2, resist: ['harish'], later: { after: 10, cred: -1, note: 'Internal audit flagged the reallocated spend. Harish raised it at the leadership meeting.' } },
          result: 'The work continues for now, but word gets around that you bent the rules.', lesson: 'Workarounds feel fast but quietly erode trust, and they surface later.' }
      ]
    },
    boss: {
      title: 'Your boss gets cold feet', who: 'boss',
      text: 'In your one-to-one, {boss} says: "Maybe we slow this down until next year. I am getting heat from the other VPs, and I cannot spend all my capital on your project."',
      options: [
        { label: 'Ask what the heat is, and offer to carry it', detail: 'Find out exactly who is pushing back and offer to brief them yourself.', tone: 'good',
          effects: { weeks: 1, gain: [['boss', 80], ['level:exec', 20]] },
          result: '{bossFirst} relaxes once they see you will absorb the political cost. Two VPs hear the case directly from you.', lesson: 'Make it easy for your sponsor to keep sponsoring you.' },
        { label: 'Go around your boss to the CEO', detail: 'The CEO said AI was a priority. Use that.', tone: 'poor',
          effects: { cred: -2, resist: ['boss'], gain: [['lena', 40]] },
          result: 'The CEO\'s office is sympathetic, but {bossFirst} feels betrayed and is now actively resisting.', lesson: 'Bypassing your boss trades a long-term sponsor for a short-term win.' },
        { label: 'Agree to slow down', detail: 'Protect the relationship and pause for six weeks.', tone: 'mixed',
          effects: { weeks: 6, gain: [['boss', 30]] },
          result: 'The relationship is intact, but you have lost six weeks of momentum.', lesson: 'Patience protects relationships, but time is also a budget.' }
      ]
    },
    incident: {
      title: 'The AI gets it wrong', who: 'manpreet',
      text: 'The AI route planner sends 14 trucks into a flooded underpass near Bhiwandi. Two Nimbus deliveries miss their window. Manpreet Singh says, loudly, "I told you so." The drivers\' WhatsApp groups are on fire.',
      options: [
        { label: 'Own it and fix it with the dispatchers', detail: 'Pause the planner for those routes and run the root-cause review with Manpreet\'s team.', tone: 'good',
          effects: { weeks: 2, cred: 1, unresist: ['manpreet'], gain: [['manpreet', 90], ['level:front', 35], ['rajesh', 30]] },
          result: 'Manpreet\'s local knowledge becomes a rule inside the planner. The frontline sees that their expertise matters.', lesson: 'Turn the expert sceptic into a co-designer, and failure becomes proof of listening.' },
        { label: 'Call it a one-off data glitch', detail: 'Reassure everyone that it will not happen again and keep going.', tone: 'poor',
          effects: { cred: -2, resist: ['gopal'], fear: ['ravi'], gain: [['level:front', -40]] },
          result: 'Nobody believes it. The frontline now reads every AI decision as a risk to them.', lesson: 'Minimising a visible failure costs more credibility than the failure itself.' },
        { label: 'Blame the vendor and switch tools', detail: 'Terminate the vendor and procure a new planner.', tone: 'mixed',
          effects: { weeks: 4, lock: [['pilot', 8]], gain: [['victor', -30]] },
          result: 'It looks decisive, but the switch costs four weeks and pilots are on hold for eight.', lesson: 'Changing the tool rarely fixes a problem of trust.' }
      ]

      scenarioId,
      seed: seedText,
      rng: hashSeed(seedText + '|' + scenarioId),
      mode: opts.mode || 'single',
      team: opts.team || '',
      session: opts.session || '',
      week: 0,
      maxWeeks: sc.weeks,
      cred: sc.startCred,
      phase: 0,
      communicated: false,
      pledged: false,
      ended: false,
      endReason: null,
      people: Object.fromEntries(PEOPLE.map(p => [p.id, {
        stage: 0, prog: 0, resisting: p.resister, fearful: p.fear,
        interviewed: false
      }])),
      lastUsed: {},      // leverId -> week the lever became reusable from (end week)
      attempts: {},      // leverId -> count
      history: [],       // decisions
      timeline: [],
      events: { escalation: false },
      pending: null,     // id of a critical decision awaiting the player's choice
      dilemmaIdx: 0,     // index of the next scenario dilemma
      scheduled: [],     // delayed consequences
      choices: []        // [dilemmaId, optionIndex, tone]
    };
    /* Realistic starting point: scenario overrides on top of the base distribution, with some progress
       already built up inside each stage so people do not all sit at exactly the same point. */
    const start = Object.assign({}, D.BASE_START || {}, sc.start || {});
    Object.entries(start).forEach(([id, st]) => {
      const p = state.people[id];
      if (!p) return;
      p.stage = st;
      p.prog = st < 4 ? Math.round(rand(state) * THRESHOLD[st] * 0.4) : 0;
    });
    state.timeline = [countsOf(state, 0)];
    return state;
  }
  function clone(s) { return JSON.parse(JSON.stringify(s)); }

  function countsOf(state, week) {
    const c = [0, 0, 0, 0, 0];
    Object.values(state.people).forEach(p => c[p.stage]++);
    return { week: week != null ? week : state.week, counts: c, cred: state.cred, phase: state.phase };
  }
  const adopters = state => Object.values(state.people).filter(p => p.stage === 4).length;
  const atLeast = (state, st) => Object.values(state.people).filter(p => p.stage >= st).length;
  const seniorSponsors = state => PEOPLE.filter(p => isSenior(p) && state.people[p.id].stage >= 3).length;

  /* Senior sponsors you need before pulling a command lever above your authority level. */
  function sponsorsNeeded(state, leverId) {
    const L = LEVER[leverId], sc = SCENARIO[state.scenarioId];
    if (!L.command) return 0;
    const need = L.authority || 3;
    return sc.authority >= need ? 0 : Math.min(3, (need - sc.authority) * 2);
  }
  function resolveWho(state, who) {
    const sc = SCENARIO[state.scenarioId];
    if (who === 'boss') return sc.reportsTo ? [sc.reportsTo] : [];
    if (who === 'all') return PEOPLE.map(p => p.id);
    if (who.startsWith('dept:')) return PEOPLE.filter(p => p.dept === who.slice(5)).map(p => p.id);
    if (who.startsWith('level:')) {
      const lv = who.slice(6);
      return PEOPLE.filter(p => p.level === lv || (lv === 'exec' && p.level === 'staff')).map(p => p.id);
    }
    return PERSON[who] ? [who] : [];
  }
  /* Add progress (may be negative); a person moves at most one stage per call. */
  function advance(state, gains, moved) {
    Object.entries(gains).forEach(([id, amt]) => {
      const s = state.people[id];
      if (s.stage >= 4) return;
      s.prog = Math.max(0, s.prog + amt);
      const need = THRESHOLD[s.stage];
      if (s.prog >= need) {
        s.prog = Math.min(s.prog - need, 20);
        s.stage += 1;
        (moved[s.stage] = moved[s.stage] || []).push(id);
      }
      if (s.stage >= 4) s.prog = 0;
    });
  }
  function fillText(state, text) {
    const sc = SCENARIO[state.scenarioId];
    const boss = sc.reportsTo ? PERSON[sc.reportsTo] : null;
    return String(text).replace(/\{boss\}/g, boss ? boss.name : 'your boss').replace(/\{bossFirst\}/g, boss ? boss.name.split(' ')[0] : 'Your boss');
  }
  /* Shared end-of-turn processing: delayed consequences, events, phase, end, next dilemma. */
  function finalize(state, decision) {
    const sc = SCENARIO[state.scenarioId];
    const due = state.scheduled.filter(x => x.week <= state.week);
    state.scheduled = state.scheduled.filter(x => x.week > state.week);
    due.forEach(x => {
      if (x.cred) state.cred = clamp(state.cred + x.cred);
      if (x.gain) {
        const g = {};
        x.gain.forEach(([who, amt]) => resolveWho(state, who).forEach(id => { g[id] = (g[id] || 0) + amt; }));
        advance(state, g, decision.moved);
      }
      decision.events.push(x.note);
    });
    if (sc.urgency === 'high' && !state.events.escalation && state.week >= 26) {
      state.events.escalation = true;
      if (atLeast(state, 3) < 5) {
        state.cred = clamp(state.cred - 1);
        decision.events.push('Week 26 check-in: Nimbus Retail sees little real progress and escalates to the board. Your credibility takes a hit.');
      } else {
        decision.events.push('Week 26 check-in: Nimbus Retail sees people genuinely trying the tools and agrees to keep its volumes in place for now.');
      }
    }
    decision.credAfter = state.cred;
    decision.credDelta = state.cred - decision.credBefore;
    if (state.phase === 0 && atLeast(state, 1) >= 18 && atLeast(state, 2) >= 10) state.phase = 1;
    if (state.phase === 1 && (adopters(state) >= 7 || atLeast(state, 3) >= 14)) state.phase = 2;
    if (adopters(state) >= CRITICAL_MASS) { state.ended = true; state.endReason = 'critical-mass'; }
    else if (state.cred <= 0) { state.ended = true; state.endReason = 'credibility'; }
    else if (state.week >= state.maxWeeks) { state.ended = true; state.endReason = 'time'; }
    if (!state.ended && !state.pending) {
      const next = sc.dilemmas[state.dilemmaIdx];
      if (next && state.week >= next[1]) { state.pending = next[0]; state.dilemmaIdx += 1; decision.dilemma = next[0]; }
    }
    state.history.push(decision);
    state.timeline.push(countsOf(state));
  }

  /* ---------- availability ---------- */
  function availability(state, leverId) {
    const L = LEVER[leverId];
    const sc = SCENARIO[state.scenarioId];
    if (state.ended) return { ok: false, reason: 'The simulation has ended.' };
    if (state.pending) return { ok: false, reason: 'Resolve the critical decision first.' };
    const readyAt = state.lastUsed[leverId];
    if (readyAt != null && state.week < readyAt) {
      return { ok: false, reason: `Available again in week ${readyAt} (${readyAt - state.week} more week${readyAt - state.week === 1 ? '' : 's'}).`, cooldown: readyAt - state.week };
    }
    if (state.week + L.weeks > state.maxWeeks) return { ok: false, reason: 'Not enough weeks left to implement this lever.' };
    if (L.pledge && state.pledged) return { ok: false, reason: 'You have already made this commitment.' };
    return { ok: true, sponsorsNeeded: sponsorsNeeded(state, leverId) };
  }

  /* ---------- core: apply a lever ---------- */
  function applyLever(prev, leverId, targetIds = []) {
    const L = LEVER[leverId];
    if (!L) throw new Error('Unknown lever ' + leverId);
    const av = availability(prev, leverId);
    if (!av.ok) throw new Error(av.reason);
    const sc = SCENARIO[prev.scenarioId];
    const state = clone(prev);
    const before = Object.fromEntries(Object.entries(state.people).map(([k, v]) => [k, v.stage]));
    const credBefore = state.cred;
    const phaseBefore = state.phase;

    let direct = L.scope === 'org' ? PEOPLE.map(p => p.id) : [...new Set(targetIds)];
    if (L.scope !== 'org' && (direct.length < 1 || direct.length > L.scope)) {
      throw new Error(`Select between 1 and ${L.scope} ${L.scope === 1 ? 'person' : 'people'}.`);
    }
    const fullSelection = L.scope === 'org' || direct.length === L.scope;

    state.week += L.weeks;
    state.lastUsed[leverId] = state.week + L.reuse;
    state.attempts[leverId] = (state.attempts[leverId] || 0) + 1;

    let credDelta = 0;
    let mult = 1;
    let outcome = 'success';           // success | partial | mistimed | blocked
    let noEffect = false;
    const notes = [];
    const credFactor = 0.55 + 0.045 * state.cred;

    /* --- authority (command levers) --- */
    if (L.command) {
      const needS = sponsorsNeeded(state, leverId);
      if (needS > 0) {
        if (seniorSponsors(state) < needS) {
          outcome = 'blocked';
          notes.push(`This lever needs ${LEVELS[L.authority]}-level authority. As a ${LEVELS[sc.authority]}, you needed ${needS} senior sponsors (executives or CEO staff) at the trial stage or beyond, and you had ${seniorSponsors(state)}. People saw it as overreach.`);
          credDelta -= 2;
        } else {
          mult *= 0.85;
          notes.push('Your senior sponsors lent you the authority to pull this lever.');
        }
      }
      if (outcome !== 'blocked' && sc.urgency === 'low' && state.phase === 0 && !L.pledge) {
        mult *= 0.6; credDelta -= 1;
        notes.push('With no visible crisis, pressure this early felt arbitrary. It worked less well and cost you credibility.');
      }
      if (outcome !== 'blocked' && sc.urgency === 'high' && leverId === 'goals' && state.phase <= 1) {
        mult *= 1.2;
        notes.push('The Nimbus deadline made hard targets feel necessary, not arbitrary.');
      }
    }
    if (sc.urgency === 'low' && L.kind === 'enabling') mult *= 1.1;
    /* Your boss's stance colours everything you do. */
    if (sc.reportsTo) {
      const b = state.people[sc.reportsTo];
      if (b.resisting && !PERSON[sc.reportsTo].resister) mult *= 0.85;
      else if (b.stage >= 3) mult *= 1.1;
    }
    /* Repetition wears off: each repeat of the same lever is less novel. */
    const repeats = state.attempts[leverId] - 1;
    if (repeats > 0) mult *= Math.pow(L.scope === 'org' ? 0.7 : 0.85, repeats);

    /* --- timing / prerequisites --- */
    if (outcome !== 'blocked') {
      if (L.needsComms && !state.communicated) {
        outcome = 'mistimed'; credDelta -= 1;
        notes.push('Nobody yet knows what change you are modelling. Communicate the change first.'); noEffect = true;
      } else if (L.needsAdopter && adopters(state) < 1) {
        outcome = 'mistimed'; credDelta -= 1;
        notes.push('There is no real adopter yet, so there is no true story to tell. It came across as spin.'); noEffect = true;
      } else if (L.needsAdopters && adopters(state) < L.needsAdopters) {
        outcome = 'mistimed'; credDelta -= 1;
        notes.push(`There is not enough progress to show yet (you need at least ${L.needsAdopters} adopters). The dashboard looked empty.`); noEffect = true;
      } else if (L.needsPhase != null && state.phase < L.needsPhase) {
        outcome = 'mistimed'; credDelta -= 2; mult *= 0.2;
        notes.push(`This lever is only effective in the ${PHASES[L.needsPhase]} phase. Pulled now, it looked like coercion before people were ready.`);
      } else if (L.needsCred != null && state.cred < L.needsCred) {
        outcome = 'mistimed'; credDelta -= 2; mult *= 0.3;
        notes.push(`You need credibility of at least ${L.needsCred} to pull this lever well.`);
      }
    }

    const gains = {}; // id -> {direct:bool, amount}
    const addGain = (id, amt, isDirect) => {
      if (amt <= 0) return;
      if (!gains[id]) gains[id] = { direct: false, amount: 0 };
      gains[id].amount += amt;
      gains[id].direct = gains[id].direct || isDirect;
    };
    const receptivity = (id, L) => {
      const p = PERSON[id], s = state.people[id];
      let r = p.openness;
      /* Broadcasts can create awareness and interest, but rarely adoption. */
      if (L.scope === 'org' && s.stage === 3 && !L.command && L.id !== 'values') r *= 0.5;
      if (s.resisting) r *= (L.id === 'listen' ? 0.7 : 0.35);
      if (s.fearful && (L.fearSensitive || L.id === 'pilot' || L.id === 'goals')) r *= 0.45;
      return r;
    };
    const jitter = () => 0.85 + rand(state) * 0.3;
    const inStages = (id, stages) => stages.includes(state.people[id].stage);

    let revealed = [];
    if (outcome !== 'blocked' && !noEffect) {
      /* --- special levers --- */
      if (L.id === 'listen') {
        direct.forEach(id => {
          if (!state.people[id].interviewed) { state.people[id].interviewed = true; revealed.push(id); }
        });
      }
      if (L.id === 'memo' || L.id === 'townhall') state.communicated = true;
      if (L.pledge) {
        state.pledged = true;
        Object.keys(state.people).forEach(id => {
          if (state.people[id].fearful) {
            state.people[id].fearful = false;
            if (inStages(id, L.stages)) addGain(id, L.strength * PERSON[id].openness * credFactor * mult * jitter(), true);
          }
        });
        notes.push('People who were held back by fear of losing their jobs can now engage with the change on its merits.');
      }

      if (L.confront) {
        const id = direct[0];
        const s = state.people[id];
        if (!s.resisting) {
          outcome = 'mistimed'; credDelta -= 1;
          notes.push(`${PERSON[id].name} was not actually resisting. Confronting them felt unfair and damaged trust.`);
        } else if (s.stage < 1) {
          outcome = 'mistimed'; credDelta -= 1;
          notes.push(`${PERSON[id].name} does not even know about the change yet. There is nothing to confront.`);
        } else {
          s.resisting = false;
          const powerMult = sc.authority <= 1 ? 0.7 : sc.authority === 2 ? 0.85 : 1;
          addGain(id, L.strength * PERSON[id].openness * credFactor * powerMult * jitter(), true);
          friendsOf(id).forEach(f => { if (inStages(f, L.stages)) addGain(f, L.strength * L.spillF * receptivity(f, L) * credFactor * jitter(), false); });
          notes.push(`${PERSON[id].name} heard you out. Their active resistance has ended.`);
        }
      } else if (L.spotlight) {
        const id = direct[0];
        if (state.people[id].stage !== 4) {
          outcome = 'mistimed'; credDelta -= 1;
          notes.push(`${PERSON[id].name} has not adopted yet. Recognising them now looked like favouritism.`);
        } else {
          const circle = new Set([...friendsOf(id), ...coworkersOf(id)]);
          circle.forEach(f => { if (inStages(f, L.stages)) addGain(f, L.strength * receptivity(f, L) * credFactor * mult * jitter(), false); });
        }
      } else if (!L.pledge) {
        /* --- standard levers --- */
        let anyApplicable = false;
        direct.forEach(id => {
          if (!inStages(id, L.stages)) return;
          anyApplicable = true;
          addGain(id, L.strength * receptivity(id, L) * credFactor * mult * jitter(), true);
        });
        if (L.spill && L.scope !== 'org') {
          direct.forEach(id => {
            if (!inStages(id, L.stages) && L.id !== 'listen') return;
            const pool = L.spill === 'friends' ? friendsOf(id) : L.spill === 'coworkers' ? coworkersOf(id) : [...new Set([...friendsOf(id), ...coworkersOf(id)])];
            const infl = 0.75 + 0.25 * PERSON[id].influence;
            pool.forEach(f => {
              if (direct.includes(f) || !inStages(f, L.stages)) return;
              addGain(f, L.strength * L.spillF * infl * receptivity(f, L) * credFactor * mult * jitter(), false);
            });
          });
        }
        if (!anyApplicable && outcome !== 'blocked') {
          if (outcome === 'success') credDelta -= 1;
          outcome = 'mistimed';
          const st = L.stages.map(i => STAGES[i].toLowerCase());
          notes.push(`This lever only works on people in the ${st.length > 1 ? st.slice(0, -1).join(', ') + ' or ' + st.slice(-1) : st[0]} stage${st.length > 1 ? 's' : ''}. None of the people it reached were there.`);
        } else if (outcome === 'success' && L.scope !== 'org') {
          const wasted = direct.filter(id => !inStages(id, L.stages));
          if (wasted.length) {
            outcome = 'partial';
            notes.push(`${wasted.map(id => PERSON[id].name.split(' ')[0]).join(', ')} ${wasted.length > 1 ? 'were' : 'was'} not at a stage this lever can move.`);
          }
        }
      }
    }

    /* --- apply progress (max one stage per lever per person) --- */
    const moved = {};
    advance(state, Object.fromEntries(Object.entries(gains).map(([k, g]) => [k, g.amount])), moved);

    /* --- credibility --- */
    if (outcome === 'success' || outcome === 'partial') {
      if (L.id === 'example') credDelta += 1;
      if (L.credGain) credDelta += L.credGain;
    }
    if (!fullSelection && L.scope !== 'org' && outcome !== 'blocked') notes.push(`You selected fewer people than this lever allows (${direct.length} of ${L.scope}).`);
    state.cred = clamp(state.cred + credDelta);

    const decision = {
      n: state.history.length + 1,
      lever: leverId,
      targets: L.scope === 'org' ? 'org' : direct,
      weekStart: prev.week,
      weekEnd: state.week,
      phaseAtStart: phaseBefore,
      outcome,
      credBefore,
      credAfter: state.cred,
      credDelta: 0,
      moved,
      directImpacted: Object.values(gains).filter(g => g.direct).length,
      indirectImpacted: Object.values(gains).filter(g => !g.direct).length,
      revealed,
      notes,
      events: []
    };
    finalize(state, decision);
    return { state, decision };
  }

  /* Pause for one week (keeps the player from ever being stuck behind cooldowns). */
  function wait(prev) {
    if (prev.ended) throw new Error('The simulation has ended.');
    if (prev.pending) throw new Error('Resolve the critical decision first.');
    const state = clone(prev);
    state.week += 1;
    const decision = { n: state.history.length + 1, lever: 'wait', targets: [], weekStart: prev.week, weekEnd: state.week,
      phaseAtStart: prev.phase, outcome: 'wait', credBefore: prev.cred, credAfter: prev.cred, credDelta: 0, moved: {},
      directImpacted: 0, indirectImpacted: 0, revealed: [], notes: ['You let a week pass to observe.'], events: [] };
    finalize(state, decision);
    return { state, decision };
  }

  /* Resolve the pending critical decision with option `idx`. */
  function resolveDilemma(prev, idx) {
    if (!prev.pending) throw new Error('No critical decision is pending.');
    const id = prev.pending, dl = DILEMMAS[id], opt = dl.options[idx];
    if (!opt) throw new Error('Unknown option.');
    const sc = SCENARIO[prev.scenarioId];
    const state = clone(prev);
    state.pending = null;
    const decision = { n: state.history.length + 1, lever: 'dilemma', dilemma: id, option: idx, tone: opt.tone, targets: [],
      weekStart: prev.week, weekEnd: prev.week, phaseAtStart: prev.phase, outcome: 'dilemma', credBefore: prev.cred, credAfter: prev.cred,
      credDelta: 0, moved: {}, directImpacted: 0, indirectImpacted: 0, revealed: [], notes: [], events: [],
      result: fillText(state, opt.result), lesson: opt.lesson };
    const ids = list => (list || []).flatMap(w => resolveWho(state, w));
    const apply = eff => {
      if (eff.cred) state.cred = clamp(state.cred + eff.cred);
      if (eff.weeks) state.week = Math.min(state.maxWeeks, state.week + eff.weeks);
      ids(eff.unresist).forEach(p => { state.people[p].resisting = false; });
      ids(eff.resist).forEach(p => { state.people[p].resisting = true; });
      ids(eff.fear).forEach(p => { state.people[p].fearful = true; });
      ids(eff.unfear).forEach(p => { state.people[p].fearful = false; });
      ids(eff.setback).forEach(p => { const s = state.people[p]; s.stage = Math.max(1, s.stage - 1); s.prog = 0; });
      (eff.lock || []).forEach(([lv, w]) => { state.lastUsed[lv] = Math.max(state.lastUsed[lv] || 0, state.week + w); });
      if (eff.gain) {
        const g = {};
        eff.gain.forEach(([who, amt]) => resolveWho(state, who).forEach(p => { g[p] = (g[p] || 0) + amt; }));
        decision.directImpacted += Object.keys(g).length;
        advance(state, g, decision.moved);
      }
      if (eff.later) state.scheduled.push({ week: state.week + eff.later.after, cred: eff.later.cred || 0, gain: eff.later.gain || null, note: eff.later.note });
    };
    apply(opt.effects);
    const low = opt.effects.lowAuthority;
    if (low && sc.authority < low.below) { apply(low); decision.notes.push(low.note); }
    decision.weekEnd = state.week;
    state.choices.push([id, idx, opt.tone]);
    finalize(state, decision);
    return { state, decision };
  }

  /* Idle: used if a player wants to end early. */
  function endGame(prev) {
    const state = clone(prev);
    state.ended = true;
    state.endReason = state.endReason || 'ended';
    return state;
  }

  /* ---------- scoring ---------- */
  function score(state) {
    const sc = SCENARIO[state.scenarioId];
    const a = adopters(state);
    const reached = a >= CRITICAL_MASS;
    const adoption = Math.round((a / PEOPLE.length) * 55);
    const progress = Math.round((Object.values(state.people).reduce((s, p) => s + p.stage, 0) / (PEOPLE.length * 4)) * 10);
    const cred = Math.round((state.cred / MAX_CRED) * 15);
    const speed = reached ? Math.round(((state.maxWeeks - state.week) / state.maxWeeks) * 20) : 0;
    const total = Math.min(100, adoption + progress + cred + speed);
    const grade = total >= 85 ? 'A' : total >= 72 ? 'B' : total >= 58 ? 'C' : total >= 45 ? 'D' : 'E';
    return { total, grade, adoption, progress, cred, speed, adopters: a, reached, weeksUsed: state.week, maxWeeks: sc.weeks };
  }

  /* ---------- debrief insights ---------- */
  function insights(state) {
    const sc = SCENARIO[state.scenarioId];
    const H = state.history.filter(h => h.lever !== 'wait' && h.lever !== 'dilemma');
    const out = [];
    const used = id => H.some(h => h.lever === id);
    const firstIdx = id => H.findIndex(h => h.lever === id);
    const mistimed = H.filter(h => h.outcome === 'mistimed' || h.outcome === 'blocked');
    const credLost = H.reduce((s, h) => s + Math.min(0, h.credDelta), 0);

    const interviews = H.filter(h => h.lever === 'listen').length;
    if (interviews === 0) out.push({ tone: 'warn', title: 'You never listened first', text: 'Listening sessions are cheap and reveal who resists and who is connected to whom. Without them you were steering blind.' });
    else if (firstIdx('listen') <= 1) out.push({ tone: 'good', title: 'You diagnosed before acting', text: 'Starting with listening sessions gave you the map of resisters and friendships that every later move depended on.' });

    const commIdx = Math.min(...['memo', 'townhall'].map(firstIdx).filter(i => i >= 0), Infinity);
    if (commIdx === Infinity) out.push({ tone: 'warn', title: 'The change was never formally communicated', text: 'Without a memo or town hall, many people never moved past awareness.' });

    if (mistimed.length) {
      const worst = mistimed.reduce((a, b) => (a.credDelta <= b.credDelta ? a : b));
      out.push({ tone: 'warn', title: `${mistimed.length} lever pull${mistimed.length > 1 ? 's were' : ' was'} mistimed`, text: `The costliest was "${LEVER[worst.lever].name}" in week ${worst.weekStart} (${worst.credDelta} credibility). ${worst.notes[0] || ''}` });
    } else out.push({ tone: 'good', title: 'Every lever was well timed', text: 'You matched each lever to the stage people were actually in.' });

    const heavy = H.filter(h => LEVER[h.lever].kind === 'substantive');
    if (sc.urgency === 'high' && sc.authority >= 3) {
      const early = heavy.some(h => h.weekStart <= 20);
      out.push(early
        ? { tone: 'good', title: 'You used your authority early', text: 'With real authority and high urgency, substantive levers pulled early, alongside enabling ones, buy speed.' }
        : { tone: 'warn', title: 'You held back your authority', text: 'With real authority and high urgency, substantive levers such as goals and deadlines work best early, in parallel with enabling levers.' });
    }
    if (sc.authority < 4) {
      const blocked = H.filter(h => h.outcome === 'blocked').length;
      if (blocked) out.push({ tone: 'warn', title: 'You reached above your authority', text: `${blocked} lever pull${blocked > 1 ? 's were' : ' was'} blocked. As a ${LEVELS[sc.authority]}, the heavier levers need senior sponsors at the trial stage or beyond before you pull them.` });
      else if (H.some(h => LEVER[h.lever].command)) out.push({ tone: 'good', title: 'You borrowed authority wisely', text: 'You built senior sponsors before reaching for levers above your level.' });
    }
    if (sc.reportsTo) {
      const b = state.people[sc.reportsTo];
      out.push(b.stage >= 3 && !b.resisting
        ? { tone: 'good', title: 'You kept your sponsor with you', text: `${PERSON[sc.reportsTo].name} ended at ${STAGES[b.stage].toLowerCase()}. Bringing your boss along made every lever stronger.` }
        : { tone: 'warn', title: 'Your boss never fully backed you', text: `${PERSON[sc.reportsTo].name} ended at ${STAGES[b.stage].toLowerCase()}${b.resisting ? ' and was resisting' : ''}. At your level, your boss's sponsorship amplifies everything you do.` });
    }
    const ch = state.choices || [];
    if (ch.length) {
      const good = ch.filter(c => c[2] === 'good').length, poor = ch.filter(c => c[2] === 'poor');
      out.push(poor.length
        ? { tone: 'warn', title: `Critical decisions: ${good} of ${ch.length} well judged`, text: `Your hardest call was "${DILEMMAS[poor[0][0]].title}". ${DILEMMAS[poor[0][0]].options[poor[0][1]].lesson}` }
        : { tone: 'good', title: `Critical decisions: ${good} of ${ch.length} well judged`, text: 'Under pressure, you chose options that protected both the change and the people.' });
    }
    if (sc.urgency === 'low' && heavy.some(h => h.phaseAtStart === 0 && LEVER[h.lever].command && !LEVER[h.lever].pledge)) {
      out.push({ tone: 'warn', title: 'Pressure without a reason', text: 'With no crisis, mandates during mobilisation felt arbitrary. In low-urgency settings, let enabling levers do the early work.' });
    }

    const fearPeople = PEOPLE.filter(p => p.fear);
    if (used('pledge')) out.push({ tone: 'good', title: 'You lowered the cost of change', text: 'The reskilling guarantee addressed fear of loss directly instead of just raising the pressure.' });
    else if (fearPeople.some(p => state.people[p.id].stage < 4)) out.push({ tone: 'warn', title: 'Fear of loss was never addressed', text: `${fearPeople.filter(p => state.people[p.id].stage < 4).map(p => p.name.split(' ')[0]).join(', ')} stayed stuck. Training and pilots work poorly on people who fear for their jobs.` });

    const resisters = PEOPLE.filter(p => p.resister);
    const stillResisting = resisters.filter(p => state.people[p.id].resisting);
    if (stillResisting.length) out.push({ tone: 'warn', title: 'Some resisters were never engaged', text: `${stillResisting.map(p => p.name).join(', ')} kept resisting to the end. A candid one-to-one, once they are aware, can turn a resister and their friends.` });
    else out.push({ tone: 'good', title: 'You turned every resister', text: 'Each active resister was engaged directly, and their friends followed.' });

    if (used('pilot') || used('champions')) {
      if ((firstIdx('pilot') >= 0 && firstIdx('pilot') < H.length / 2) || (firstIdx('champions') >= 0 && firstIdx('champions') < H.length / 2))
        out.push({ tone: 'good', title: 'You crossed the chasm', text: 'Pilots and champions moved people from interest into trial — the pivotal, behaviour-changing stage.' });
    } else out.push({ tone: 'warn', title: 'No pilots or champions', text: 'Without learning-by-doing, interest rarely turns into trial.' });

    if (credLost <= -3) out.push({ tone: 'warn', title: 'Credibility was your scarcest resource', text: `You spent ${-credLost} points of credibility on moves that did not land. Each point lost made every later lever weaker.` });
    return out;
  }

  /* ---------- results code for class mode ---------- */
  function resultRecord(state) {
    const s = score(state);
    return {
      v: 1,
      team: state.team || 'Player',
      session: state.session || '',
      scenario: state.scenarioId,
      score: s.total,
      grade: s.grade,
      adopters: s.adopters,
      reached: s.reached,
      cred: state.cred,
      weeks: state.week,
      maxWeeks: state.maxWeeks,
      end: state.endReason,
      dilemmas: state.choices,
      levers: state.history.filter(h => h.lever !== 'wait' && h.lever !== 'dilemma').map(h => [h.lever, h.weekStart, h.outcome[0], h.credDelta]),
      curve: state.timeline.map(t => [t.week, t.counts[4], t.counts[3]]),
      at: new Date().toISOString()
    };
  }
  function encodeResult(rec) {
    const json = JSON.stringify(rec);
    const b64 = typeof btoa !== 'undefined' ? btoa(unescape(encodeURIComponent(json))) : Buffer.from(json, 'utf8').toString('base64');
    return 'TP1.' + b64;
  }
  function decodeResult(code) {
    const c = String(code).trim();
    if (c.startsWith('{')) return JSON.parse(c);
    if (!c.startsWith('TP1.')) throw new Error('Not a Tipping Point result code');
    const b64 = c.slice(4);
    const json = typeof atob !== 'undefined' ? decodeURIComponent(escape(atob(b64))) : Buffer.from(b64, 'base64').toString('utf8');
    return JSON.parse(json);
  }

  const ENGINE = {
    newGame, applyLever, wait, resolveDilemma, fillText, sponsorsNeeded, availability, endGame, score, insights, resultRecord, encodeResult, decodeResult,
    adopters, atLeast, seniorSponsors, friendsOf, coworkersOf, LEVER, PERSON, SCENARIO, hashSeed
  };
  if (typeof module !== 'undefined' && module.exports) module.exports = ENGINE;
  else root.TP_ENGINE = ENGINE;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Tipping Point — user interface. */
(function () {
  'use strict';
  const D = window.TP_DATA, E = window.TP_ENGINE;
  const { STAGES, PEOPLE, LEVERS, SCENARIOS, PHASES, COMPANY, CONCEPTS, CRITICAL_MASS, MAX_CRED, LEVELS, DILEMMAS } = D;
  const asLevel = sc => (sc.authority === 4 ? 'C-suite executive' : sc.level);
  const quadIndex = sc => (sc.urgency === 'high' ? 2 : 0) + (sc.power === 'high' ? 1 : 0);
  const authMeter = n => `<span class="auth" title="Authority ${n} of 4">${[1, 2, 3, 4].map(i => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</span>`;
  const P = E.PERSON, L = E.LEVER, S = E.SCENARIO;

  const ST_COLOR = ['var(--st0)', 'var(--st1)', 'var(--st2)', 'var(--st3)', 'var(--st4)'];
  const LV_COLOR = { staff: 'var(--lv-staff)', exec: 'var(--lv-exec)', mid: 'var(--lv-mid)', front: 'var(--lv-front)' };
  const LV_NAME = { staff: 'CEO staff', exec: 'Top executives', mid: 'Middle managers', front: 'Frontline' };
  const EXECS = ['imran', 'devika', 'arjun', 'sunita', 'kofi'];
  const ORG_ORDER = ['lena', 'harish', 'imran', 'neha', 'victor', 'devika', 'priya', 'gopal', 'rajesh', 'manpreet', 'ravi', 'arjun', 'meilin', 'sameer', 'sunita', 'fatima', 'kofi', 'daniel', 'ananya', 'joanna'];

  /* ---------- storage (never required) ---------- */
  const store = {
    get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* ignore */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } }
  };

  /* ---------- app state ---------- */
  const app = {
    view: 'home', game: null, selLever: null, selTargets: [], drawer: null, news: null, menu: false,
    home: { mode: 'single', scenario: 's4', team: '', session: '' },
    fac: { records: store.get('tp_fac') || [], sort: 'score', session: 'all' },
    flash: [], netFocus: null, toast: null, confirm: null

  const saved = store.get('tp_game');
  const theme = store.get('tp_theme');

  /* ---------- helpers ---------- */
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const initials = name => name.replace(/[^A-Za-z ]/g, '').split(' ').filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const first = id => P[id].name.split(' ')[0];
  const plural = (n, w, pl) => `${n} ${n === 1 ? w : (pl || w + 's')}`;
  const listNames = ids => ids.map(first).join(', ');

  const I = {
    warn: '<path d="M12 3 2 21h20L12 3Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M12 10v5M12 18v.5" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>',
    chat: '<path d="M4 5h16v11H9l-5 4V5Z" fill="currentColor"/>',
    fear: '<path d="M12 21s-8-5-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 6-8 11-8 11Z" fill="currentColor"/>',
    check: '<path d="m5 12 5 5 9-10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>',
    x: '<path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>',
    menu: '<path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
